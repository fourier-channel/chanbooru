# This is a Docker Compose file that will launch a minimal Danbooru instance.
# This is suitable as a quick demo or for personal use, but is not recommended
# for a large public-facing site.
#
# ## Quickstart
#
# First run `bin/setup`. Then run `docker compose up` to start a Danbooru instance on http://localhost:3000.
#
# Run `docker compose down` to stop the instance.
#
# Run `docker volume rm danbooru-data danbooru-images iqdb-data` to delete all
# your data if you no longer need it.
#
# See below for more commands for running your instance.
#
# ## Configuration
#
# To configure your instance, edit the files `.env.local` or `config/danbooru_local_config.rb`
# outside the container.
#
# Start by copying either `config/danbooru_default_config.rb` to `config/danbooru_local_config.rb`,
# or `.env` to `.env.local`. Then edit the files as needed.
#
# See `config/danbooru_default_config.rb` for the default settings.
#
# ## Usage
#
#  # Start a Danbooru instance on http://localhost:3000.
#  docker compose up
#
#  # Stop the instance.
#  docker compose down
#
#  # Upgrade the instance to the latest version of Danbooru.
#  docker compose pull
#  docker compose restart
#
#  # Backup the database and images.
#  docker compose run --rm -T danbooru bin/rails danbooru:database:backup > danbooru-database.pg_dump
#  docker compose run --rm -T danbooru bin/rails danbooru:images:backup > danbooru-images.tar
#  docker compose cp iqdb:/iqdb/data/iqdb.sqlite ./
#
#  # Restore the database and images from backup.
#  docker compose down
#  docker volume rm danbooru-data danbooru-images iqdb-data
#  docker compose run --rm -T danbooru bin/rails danbooru:database:restore < danbooru-database.pg_dump
#  docker compose run --rm -T danbooru bin/rails danbooru:images:restore < danbooru-images.tar
#  docker compose cp ./iqdb.sqlite iqdb:/iqdb/data/iqdb.sqlite
#
#  # Delete all the data for the instance.
#  docker compose down
#  docker volume rm danbooru-data danbooru-images iqdb-data
#
#  # Start a Bash shell inside the instance (for debugging).
#  docker compose run --rm danbooru bash
#
#  # Start a Rails console inside the instance (for debugging)
#  docker compose run --rm danbooru bin/rails console
#
#  # Start a Postgres shell inside the instance (for debugging)
#  docker compose run --rm danbooru bin/rails dbconsole -p
#
#  # Start two instances of Danbooru at the same time, one named `danbooru-latest` and the other
#  # `danbooru-production`. Good for comparing two different versions of Danbooru.
#  DANBOORU_PORT=3000 DANBOORU_IMAGE=ghcr.io/danbooru/danbooru:latest docker compose -p danbooru-latest up
#  DANBOORU_PORT=3001 DANBOORU_IMAGE=ghcr.io/danbooru/danbooru:production docker compose -p danbooru-production up
#  docker compose -p danbooru-latest down --volumes
#  docker compose -p danbooru-production down --volumes
#
#  # Show the logs for the Danbooru container.
#  docker compose logs -f danbooru
#
# References:
#
# * https://docs.docker.com/get-docker/
# * https://docs.docker.com/compose/install/
# * https://docs.docker.com/compose/release-notes

# You can change the name to run multiple Danbooru instances simultaneously.
# This doesn't change the name of the site, it only affects the name used by Docker Compose.
name: danbooru

x-sqs-env: &sqs-env
  # Required to have working post and pool versions
  DANBOORU_AWS_SQS_REGION: us-east-1
  DANBOORU_AWS_ACCESS_KEY_ID: dummy
  DANBOORU_AWS_SECRET_ACCESS_KEY: dummy
  DANBOORU_AWS_SQS_ARCHIVES_URL: http://sqs:9324/000000000000/danbooru.fifo
  DANBOORU_AWS_SQS_HOST: http://sqs:9324

x-base-template: &base-template
  # You can set DANBOORU_IMAGE to `ghcr.io/danbooru/danbooru:master` to get the latest unstable release,
  # or e.g. `ghcr.io/danbooru/danbooru:production-2024.01.12-055003-utc` to get a specific stable version.
  #
  # See https://github.com/danbooru/danbooru/pkgs/container/danbooru for a list of versions
  image: ${DANBOORU_IMAGE:-ghcr.io/danbooru/danbooru:production}

  read_only: true
  restart: unless-stopped

  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
    start_period: 120s
    interval: 10s
    retries: 1

  environment:
    <<: *sqs-env
    # The public URL of your site. You can set this if you have a domain name for your site.
    DANBOORU_CANONICAL_URL: ${DANBOORU_CANONICAL_URL:-}

    # Set this to true if you're running behind a reverse proxy, such as Cloudflare.
    DANBOORU_REVERSE_PROXY: "true"

    # You should set DANBOORU_SECRET_KEY_BASE to a random secret string. If you
    # don't set this, you will be logged out every time you restart the instance.
    #
    # Keep this secret. If someone finds this out, they will be able to log in as any user.
    # DANBOORU_SECRET_KEY_BASE: "<random secret password>"

    # Don't change the options below.
    RAILS_ENV: production
    # pool IS PER PROCESS, and it must equal the process's thread count.
    #
    # Upstream ships ?pool=100 here. On 2026-09-10 at 21:10Z that took the site
    # down: puma runs `workers :auto` (14 on this box) x 5 threads, so the web
    # tier could hold 1,400 connections against Postgres's max_connections of
    # 100 -- and pools only ever grow. 99 of the 100 backends were puma's, all
    # idle; good_job, cron, the archives service and every upload got "sorry,
    # too many clients already", including the superuser reserved slots.
    # Recycling the container cleared it and puma was back to 95 within three
    # minutes. RAILS_MAX_THREADS is 5, so 5 is the honest pool; good_job runs 5
    # threads and cron one, so the same URL is right for them too.
    DATABASE_URL: postgresql://danbooru@postgres/danbooru?pool=5
    # Six workers, not :auto. :auto forked 14 on a 12-vCPU guest whose puma
    # measured 0.3 cores in total; 6 x 5 = 30 web connections and headroom for
    # everything else. Only puma reads this; cron and jobs share the template
    # and ignore it. It lives HERE rather than under the danbooru service
    # because YAML merge keys are shallow -- an `environment:` under the
    # service would replace this whole block and drop DATABASE_URL.
    PUMA_WORKERS: "6"
    DANBOORU_REDIS_URL: redis://redis:6379
    DANBOORU_IQDB_URL: http://iqdb:5588
    # The autotagger is OFF in production (operator, 2026-09-30). It ran a CPU
    # tagging model on 41chan for every upload -- about one core, sustained --
    # and nothing read what it wrote: its ai_tags feed only the upload page's
    # suggested-tags column, the ai: search and Discord /tagme. Every post's
    # real tags come from fourier-spectrum and fourier-hydra (fourier_tag_sources).
    # Blank, AutotaggerClient skips the call; set but unreachable, it FAILS every
    # upload (media_asset.rb task1.wait!) -- so uncomment this line AND the
    # service below together, never one alone.
    # DANBOORU_AUTOTAGGER_URL: http://autotagger:5000
    DANBOORU_IMAGE_STORAGE_PATH: /images
    # The release's own bootsnap cache (bin/chanbooru-release builds it for
    # the release's paths); the image's was built for code it no longer runs.
    BOOTSNAP_CACHE_DIR: /danbooru/.bootsnap
    # The creator-prefix list (app/logical/creator_prefixes.rb): which tag
    # prefixes are provenance and locked. Read live from the mount below, so a
    # prefix is added or changed by editing that file, never by a rebuild.
    FOURIER_CREATOR_PREFIXES: /fourier-config/creator_prefixes.yml

  tmpfs:
    - /tmp

  # Long syntax, and create_host_path: false, on purpose. The short form
  # (`host:/images`) makes a missing host path as an empty root-owned
  # directory and starts against it, so an unmounted storage drive came up
  # as a booru with no images on the root disk and every check green
  # (installed-locations audit 2026-10-04). The directory is made by
  # `sudo bin/chanbooru-storage install` and nothing else; the same path is
  # in nginx below and in that script, and a test holds the three together.
  volumes:
    - type: bind
      source: /mnt/storage/danbooru-images
      target: /images
      bind:
        create_host_path: false
    # THE CODE IS A RELEASE, not the copy baked into the image: the live
    # commit's app tree, compiled assets and bootsnap cache, installed by
    # bin/chanbooru-release and mounted read-only (fourier-basis
    # docs/design/CHANBOORU_RELEASES.md). `current` is a link the deploy
    # writes; Docker resolves it when a container starts, so a release goes
    # live when the deploy recreates the containers. Never created by compose.
    - type: bind
      source: ${CHANBOORU_RELEASES_ROOT:-/srv/danbooru}/current
      target: /danbooru
      read_only: true
      bind:
        create_host_path: false
    # The live creator-prefix list. A DIRECTORY, not the file: a file bind
    # pins the inode, so an editor that saves by rename would never be seen
    # inside the container. Outside the release because the release is
    # read-only and replaced on every deploy; outside the checkout's tracked
    # tree because the deploy copy must stay clean (gitignored). Canon is
    # fourier-basis ops/hetzner/danbooru/creator_prefixes.yml.
    # create_host_path is true on purpose, unlike the two above: a missing
    # directory costs only tag edits, which are refused with the fix named
    # (CreatorPrefixes::ConfigError), where false would keep the site down.
    - type: bind
      source: ${CHANBOORU_FOURIER_CONFIG:-./fourier-config}
      target: /fourier-config
      read_only: true
      bind:
        create_host_path: true

  configs:
    - source: danbooru_local_config
      target: /danbooru/config/danbooru_local_config.rb
    - source: env_local
      target: /danbooru/.env.local

services:
  danbooru:
    <<: *base-template
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-c", "bin/rails db:prepare && bin/rails server -b 0.0.0.0"]

  cron:
    <<: *base-template
    depends_on:
      danbooru:
        condition: service_healthy
    command: ["bin/rails", "danbooru:cron"]

  jobs:
    <<: *base-template
    depends_on:
      danbooru:
        condition: service_healthy
    command: ["bin/good_job", "start"]

  # https://github.com/danbooru/iqdb
  # https://hub.docker.com/repository/docker/evazion/iqdb
  iqdb:
    image: evazion/iqdb
    volumes:
      - "iqdb-data:/iqdb/data"
    command: ["http", "0.0.0.0", "5588", "/iqdb/data/iqdb.sqlite"]

  redis:
    image: redis:6.2.6

  postgres:
    image: ghcr.io/danbooru/postgres:16.1
    shm_size: 1gb
    environment:
      POSTGRES_USER: danbooru
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "danbooru"]
      start_period: 30s
      interval: 1s
      retries: 1
    volumes:
      - "danbooru-data:/var/lib/postgresql/data"

  nginx:
    image: ${DANBOORU_IMAGE:-ghcr.io/danbooru/danbooru:production}
    command: ["openresty", "-e", "/dev/stderr"]
    environment:
      # The external port to listen on. You can set this to 80 if you have nothing else listening on port 80.
      DANBOORU_PORT: "${DANBOORU_PORT:-3000}"

      # If your instance is running behind a reverse proxy (such as Cloudflare, Ngrok, etc), then set this to true.
      #
      # If you get a `HTTP Origin header didn't match request.base_url` error when creating a new account, then set this to true.
      DANBOORU_REVERSE_PROXY: "true"

      # Used by Nginx to determine the root directory if we're running in a subdirectory (e.g. http://example.com/danbooru).
      DANBOORU_CANONICAL_URL: ${DANBOORU_CANONICAL_URL:-}
    ports:
      - "127.0.0.1:${DANBOORU_PORT:-3000}:3000"
    depends_on:
      danbooru:
        condition: service_started
    configs:
      - source: nginx
        target: /usr/local/nginx/conf/nginx.conf
    # Same mounts, same rules as the base template above: nginx serves
    # /danbooru/public (the compiled assets) from the release.
    volumes:
      - type: bind
        source: /mnt/storage/danbooru-images
        target: /images
        bind:
          create_host_path: false
      - type: bind
        source: ${CHANBOORU_RELEASES_ROOT:-/srv/danbooru}/current
        target: /danbooru
        read_only: true
        bind:
          create_host_path: false

  # Off in production; see DANBOORU_AUTOTAGGER_URL above for why and how to restore.
  # autotagger:
  #   image: ghcr.io/danbooru/autotagger:latest

  sqs:
    image: softwaremill/elasticmq-native
    expose:
    - 9324
    volumes:
      - sqs-data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true

  archives-service:
    depends_on:
      sqs:
        condition: service_started
      postgres:
        condition: service_healthy
    image: ghcr.io/danbooru/archives:latest
    environment:
      <<: *sqs-env
      RUN: 1
      #db config
      POSTGRES_HOST: postgres
      POSTGRES_DB: danbooru
      POSTGRES_USER: danbooru
      # POSTGRES_PASSWORD=
    command: ["scripts/docker-bootstrap.sh"]
    restart: unless-stopped
    stdin_open: true
    tty: true

configs:
  danbooru_local_config:
    file: config/danbooru_local_config.rb
  env_local:
    file: .env.local
  nginx:
    file: config/nginx.conf

volumes:
#  danbooru-images:
#    name: ${COMPOSE_PROJECT_NAME}-images
  danbooru-data:
    name: ${COMPOSE_PROJECT_NAME}-data
  iqdb-data:
    name: ${COMPOSE_PROJECT_NAME}-iqdb-data
  sqs-data:
    name: ${COMPOSE_PROJECT_NAME}-sqs-data
