# How this repo is gated, declared by the repo itself.
#
# `coherence gate` reads this. It lives HERE and not in a machine column
# because the gate command is a fact about the repo, and a column describes
# one machine -- there are three, hand-maintained, and nothing compares them.
# Declared here, it travels to every box because it is the repo.
#
#   gate    the class B command: this repo's own toolchain. `class-a-only`
#           states there is none, and coherence VERIFIES that claim.
#   suite   the command whose run reports the test count (WORKING-RULES
#           rule 6), quoted back in a derived-facts denial.
#   exclude paths held out of the confusable check: vendored or upstream
#           content that is not ours to normalize.

# The toolchain is not on the host and never was: Ruby 4.0.6 and Rails 8.1.3.1
# live in the devbooru stack (`docker-compose.dev.yaml`, project name devbooru,
# `bin/dev` is the shortcut).
#
# SCOPED TO THE TESTS THIS FORK OWNS. The full suite is 6,368 tests and 32
# minutes and CANNOT be green here: measured 2026-08-30 it returned 115
# failures, 20 errors and 475 skips, of which 127 were upstream source-extractor
# tests fetching live third-party sites. Zero were in fork-owned tests. A gate
# that is always red gets ignored, which costs the same as no gate plus half an
# hour of the machine.
#
# script/fork-tests.sh DERIVES the list from upstream/master...HEAD rather than
# maintaining one, refuses to report a pass on an empty list, and leaves a core
# free. 284 tests, 0 failures, 2m36s.
#
# The full suite still matters before a deploy or an upstream merge. It is not
# the commit gate.
gate: bash script/fork-tests.sh
suite: bash script/fork-tests.sh

# Upstream Danbooru content: Japanese and Chinese test fixtures, a ZWJ inside
# a flag emoji in a test asserting emoji normalization, and typographic
# apostrophes in legal boilerplate. Not ours to normalize.
exclude:
  - test/
  - app/views/static/
  - app/views/dmcas/
