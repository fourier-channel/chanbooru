# How this repo is gated, declared by the repo itself.
#
# `coherence gate` reads this. It lives HERE and not in a machine column
# because the gate command is a fact about the repo, and a column describes
# one machine -- there are three, hand-maintained, and nothing compares them.
# Declared here, it travels to every box because it is the repo.
#
#   gate    the class B command: this repo's own toolchain. `class-a-only`
#           states there is none, and coherence VERIFIES that claim.
#   suite   the command whose run reports the test count (WORKING-RULES
#           rule 6), quoted back in a derived-facts denial.
#   exclude paths held out of the confusable check: vendored or upstream
#           content that is not ours to normalize.

# The toolchain is not on the host and never was: Ruby 4.0.6 and Rails 8.1.3.1
# live in the devbooru stack (`docker-compose.dev.yaml`, project name devbooru,
# `bin/dev` is the shortcut). The first version of this declared a bare
# `bundle exec rails test`, which reported "toolchain absent" on a box that has
# had it running for days -- the gate was wrong about the machine, not the
# machine wrong about the gate.
#
# `exec` rather than `run`, because the stack is long-lived here. If it is down,
# docker says "is not running" and coherence reports that as unmeasured rather
# than as a failing suite.
#
# PARALLEL_WORKERS leaves one core free. Rails defaults to one test worker per
# processor, which on this 4-core box took all four: host idle measured 0.0%
# while the suite ran, starving the interactive session and devbooru's own
# services. A gate that has to seize the whole machine is a gate nobody runs
# before a commit, which makes it worse than no gate.
#
# Computed from nproc rather than hard-coded, because this file travels with the
# repo to every box and their core counts differ. `--ignore=1` floors at 1, and
# unlike a shell ternary it contains no `?` or `: ` -- both are YAML indicators,
# and the first draft of this line silently parsed to an empty gate.
gate: docker compose -f docker-compose.dev.yaml exec -T -e RAILS_ENV=test -e PARALLEL_WORKERS=$(nproc --ignore=1) danbooru bin/rails test
suite: docker compose -f docker-compose.dev.yaml exec -T -e RAILS_ENV=test -e PARALLEL_WORKERS=$(nproc --ignore=1) danbooru bin/rails test

# Upstream Danbooru content: Japanese and Chinese test fixtures, a ZWJ inside
# a flag emoji in a test asserting emoji normalization, and typographic
# apostrophes in legal boilerplate. Not ours to normalize.
exclude:
  - test/
  - app/views/static/
  - app/views/dmcas/
