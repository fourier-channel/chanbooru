# How this repo is gated, declared by the repo itself.
#
# `coherence gate` reads this. It lives HERE and not in a machine column
# because the gate command is a fact about the repo, and a column describes
# one machine -- there are three, hand-maintained, and nothing compares them.
# Declared here, it travels to every box because it is the repo.
#
#   gate    the class B command: this repo's own toolchain. `class-a-only`
#           states there is none, and coherence VERIFIES that claim.
#   suite   the command whose run reports the test count (WORKING-RULES
#           rule 6), quoted back in a derived-facts denial.
#   exclude paths held out of the confusable check: vendored or upstream
#           content that is not ours to normalize.
#   timeout the class B budget in seconds (default 1800). A run past it is
#           stopped and FAILS; each run prints its time against it.
#   deploy_gate     optional: the whole suite, where `gate` is narrowed to
#                   what a change touches. `coherence gate --deploy` runs it in
#                   place of `gate`, before a deploy.
#   deploy_timeout  its budget in seconds (default 1800).
#   deploy_stamp    optional, true or false: a `--deploy` PASS pushes the tag
#                   deploy-gate/<commit>, the record a serving box may require.
#                   Withheld (PARTIAL) unless the tree was HEAD, unchanged
#                   through the run, and HEAD was origin's tip.
#   deploy_stamp_ignore  path prefixes no deploy reads, which may differ from
#                   HEAD without withholding the stamp (e.g. .vscode/).

# The toolchain is not on the host and never was: Ruby 4.0.6 and Rails 8.1.3.1
# live in the devbooru stack (`docker-compose.dev.yaml`, project name devbooru,
# `bin/dev` is the shortcut).
#
# TWO TIERS (operator ruling 2026-10-24). The tests this fork owns had grown
# to 3,173 and 38m04s on vesper (measured 2026-10-24, one failure, since
# fixed) -- too long to run before every commit. So:
#
#   gate         script/change-tests.sh: the tests the change touches, mapped
#                from the files that differ from origin/chanbooru, plus a
#                three-file smoke set. Minutes. A change to what every test
#                stands on (runtime, schema, test helpers, base classes) is
#                not narrowed: it runs the fork set.
#   deploy_gate  script/fork-tests.sh: every test file the fork owns, derived
#                from upstream/master...HEAD. Before a deploy,
#                `coherence gate --deploy`. Each run writes per-file times to
#                ~/.local/state/chanbooru/fork-test-timing.tsv.
#
# The accepted cost, in the operator's terms: the branch can go red between
# deploys, and the deploy gate catches it before production does.
#
# Not the full upstream suite (6,368 tests): it cannot be green here --
# measured 2026-08-30, 127 of its failures were upstream source-extractor
# tests fetching live third-party sites, and none were in fork-owned tests.
# It still matters before an upstream merge.
gate: bash script/change-tests.sh
deploy_gate: bash script/fork-tests.sh
suite: bash script/fork-tests.sh
# Both 60 minutes: the fork set took 38m04s, and a commit gate that cannot
# be narrowed runs the fork set too.
timeout: 3600
deploy_timeout: 3600

# THE DEPLOY REQUIRES THE STAMP (operator 2026-10-25: "make it so the
# chanbooru deploy must go through the gate"). bin/chanbooru-deploy refuses
# any commit without deploy-gate/<commit> on origin, so a deploy-tier PASS is
# the only way onto production. .vscode/ is editor state on vesper's checkout;
# no deploy reads it.
deploy_stamp: true
deploy_stamp_ignore:
  - .vscode/

# Upstream Danbooru content: Japanese and Chinese test fixtures, a ZWJ inside
# a flag emoji in a test asserting emoji normalization, and typographic
# apostrophes in legal boilerplate. Not ours to normalize.
exclude:
  - test/
  - app/views/static/
  - app/views/dmcas/
