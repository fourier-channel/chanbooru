daemon off;
worker_processes 1;
pcre_jit on;

error_log stderr info;
pid /tmp/nginx.pid;

# If true, assume we're behind a reverse proxy.
env DANBOORU_REVERSE_PROXY;

# The external port the Nginx Docker container is listening on.
env DANBOORU_PORT;

# The URL of the site. Used to determine the root directory if we're running in a subdirectory (e.g. http://example.com/danbooru).
env DANBOORU_CANONICAL_URL;

events {}

http {
  charset utf-8;
  include mime.types;

  sendfile on;
  tcp_nopush on;
  access_log /dev/stdout;
  resolver local=on;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  gzip on;
  gzip_comp_level 5;
  gzip_types application/xml+rss application/atom+xml application/javascript application/json application/rss+xml application/vnd.ms-fontobject application/x-font-ttf application/xhtml+xml application/xml font/opentype image/svg+xml image/x-icon text/css text/javascript text/plain;
  gzip_proxied any;
  gzip_vary on;

  server {
    server_name _;
    listen 3000;

    set_by_lua_block $reverse_proxy { return os.getenv("DANBOORU_REVERSE_PROXY") }
    set_by_lua_block $danbooru_port { return os.getenv("DANBOORU_PORT") }
    set_by_lua_block $app_root {
      local url = os.getenv("DANBOORU_CANONICAL_URL") or ""
      return url:match("^https?://.*(/.+)")
    }

    # Remove leading subdir if we're running in a subdir (e.g. /danbooru/posts/1 -> /posts/1).
    # This does the same thing as `rewrite ^$app_root/(.*) /$1;`, except it works with variables.
    rewrite_by_lua_block {
      local uri = ngx.var.uri
      local app_root = ngx.var.app_root

      if not (app_root == "") and uri:find(app_root) == 1 then
        uri = uri:sub(#app_root + 1) -- /danbooru/posts/123 -> /posts/123
        if uri == "" then uri = "/" end
        ngx.req.set_uri(uri, true)
      end
    }

    # Go to http://localhost:3000/nginx/headers to see the raw HTTP headers received by Nginx. Useful for debugging reverse proxy setups.
    location = /nginx/headers {
      echo_duplicate 1 $echo_client_request_headers;
      echo "\r";
    }

    location ~ ^/(packs/|fonts/|images/|favicon\.ico$|favicon\.svg$|apple-touch-icon\.png$|apple-touch-icon-precomposed\.png$) {
      root /danbooru/public;
      expires max;
    }

    location /data {
      root /images;
      expires max;

      rewrite (.*)/__.+?__(.+)$ $1/$2;
      rewrite ^/data/(.*) /$1;

      if ($arg_download) {
        more_set_headers 'Content-Disposition: attachment';
      }

      break;
    }

    location /fourier/ {
      set $fourier_auth http://fourier-auth:8010;
      rewrite ^/fourier/(.*) /$1 break;
      proxy_pass $fourier_auth;
      proxy_redirect off;
      proxy_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Fourier-Identity "";
    }

    # 6b: internal subrequest target for the Lua identity resolver in location /.
    # Deferred DNS (set var + variable proxy_pass) like /fourier/, so a cold start
    # does not hard-depend on fourier-auth. Forwards the session cookie; strips any
    # client-supplied identity so the subrequest itself cannot be seeded.
    location = /__fourier_verify {
      internal;
      set $fourier_verify http://fourier-auth:8010;
      rewrite ^ /verify break;
      proxy_pass $fourier_verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Fourier-Identity "";
      proxy_set_header Cookie $http_cookie;
    }

    location / {
      proxy_pass http://danbooru:3000$request_uri;
      proxy_redirect off;
      proxy_buffering on;

      # 6b: resolve the verified Matrix identity via a Lua subrequest to fourier-auth
      # (this openresty build lacks ngx_http_auth_request_module, so auth_request is
      # unavailable). We only pay the subrequest when a fourier_session cookie exists;
      # otherwise the identity is just cleared. pcall + status-guard fail SAFE: any
      # fourier-auth/Lua error degrades to "no identity" (admin-only editing), never a
      # booru-wide 500. Any client-supplied X-Fourier-Identity is dropped unless
      # /verify confirms a real session -- this is the 6a strip plus the 6b set.
      access_by_lua_block {
        local mxid = nil
        local session_info = nil
        if ngx.var.cookie_fourier_session and ngx.var.cookie_fourier_session ~= "" then
          local ok, res = pcall(ngx.location.capture, "/__fourier_verify")
          if ok and res and res.status and res.status < 300 then
            mxid = res.header["X-Fourier-Identity"]
            -- Forward-contract for the session bar's tooltips: when the gate
            -- starts answering /verify with session info (previous token
            -- digest, expiry, next refresh, as JSON), it rides through here.
            -- nil until then, and the set_header below clears any
            -- client-supplied value either way.
            session_info = res.header["X-Fourier-Session-Info"]
          end
        end
        ngx.req.set_header("X-Fourier-Identity", mxid)
        ngx.req.set_header("X-Fourier-Session-Info", session_info)
      }

      set_by_lua_block $forwarded_host {
        if ngx.var.reverse_proxy == "true" and ngx.var.http_x_forwarded_host then
          ngx.req.set_header("X-Forwarded-For",   ngx.var.proxy_add_x_forwarded_for)
          ngx.req.set_header("X-Forwarded-Host",  ngx.var.http_x_forwarded_host)
          ngx.req.set_header("X-Forwarded-Port",  ngx.var.http_x_forwarded_port)
          ngx.req.set_header("X-Forwarded-Proto", ngx.var.http_x_forwarded_proto)
          return ngx.var.http_x_forwarded_host
        else
          ngx.req.set_header("X-Forwarded-For",   ngx.var.remote_addr)
          ngx.req.set_header("X-Forwarded-Host",  ngx.var.http_host)
          ngx.req.set_header("X-Forwarded-Port",  ngx.var.danbooru_port)
          ngx.req.set_header("X-Forwarded-Proto", ngx.var.scheme)
          return ngx.var.http_host
        end
      }

      proxy_set_header Host $forwarded_host;

      client_max_body_size 100m;
    }
  }
}
